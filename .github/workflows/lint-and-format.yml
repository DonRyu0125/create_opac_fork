name: Format and Lint

on:
    pull_request:
        branches: ['*']

jobs:
    format-and-lint:
        runs-on: ubuntu-latest
        name: Lint, Format Code

        strategy:
            matrix:
                node-version: [16.x, 18.x] # Run on multiple Node.js versions if needed

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm' # Cache npm dependencies

            - name: Install Dependencies
              run: npm ci # Faster than install and ensures a clean install

            - name: Format Code
              run: npm run format

            - name: Lint Code
              run: npm run lint
