name: Format and Lint

on:
  pull_request:
    branches: ["*"]


jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    name: pnpm lint and format

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Node lts
        uses: actions/setup-node@v3
        with:
          node-version: 'latest'

      - uses: pnpm/action-setup@v2.2.4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 8.6.1
          run_install: false

      - name: Format Code
        run: pnpm run format

      - name: Lint Code
        run: pnpm run lint
